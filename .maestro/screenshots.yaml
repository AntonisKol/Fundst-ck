# Takes the README screenshots on the iOS Simulator - see scripts/screenshots.sh.
# EMAIL and PASSWORD (a demo account) are passed in with -e, never stored here.
# APP_ID picks the app: Expo Go (host.exp.Exponent) or the native build from
# `npx expo run:ios` (com.antoniskol.lostandfound-app). The script sets it.
appId: ${APP_ID}
name: README screenshots
env:
  APP_ID: host.exp.Exponent
  EXPO_URL: exp://127.0.0.1:8082
  # Position of "Not Now" on the iOS "Save Password?" pop-up; differs per
  # device. iPhone 17: 32%,63% - iPhone SE (3rd gen): 30%,66%.
  NOT_NOW: "32%,63%"
---
# The flow never looks for a specific post or chat: it opens the first item
# card (testID "item-card") and the first conversation (testID
# "conversation-row"), so it keeps working when posts are deleted or returned.
# Tabs are matched by their accessibility label ("Feed, tab, 1 of 5").

# Close the app first so every run starts fresh on the landing page.
- stopApp
- runFlow:
    when:
      true: ${APP_ID == 'host.exp.Exponent'}
    commands:
      - openLink: ${EXPO_URL}
      # A fresh simulator asks once: Open in "Expo Go"?
      - tapOn:
          text: "Open"
          optional: true
- runFlow:
    when:
      true: ${APP_ID != 'host.exp.Exponent'}
    commands:
      - launchApp
- extendedWaitUntil:
    visible: "Get Started"
    timeout: 60000  # the first bundle from Metro can take a while
- tapOn: "Get Started"

# Start signed out, so screens show what a new visitor sees.
- tapOn: "Settings, tab.*"
- runFlow:
    when:
      visible: "Sign Out"
    commands:
      - tapOn: "Sign Out"

# Signed out: Feed, item details, Map
- tapOn: "Feed, tab.*"
- extendedWaitUntil:
    visible:
      id: "item-card"
    timeout: 15000
- takeScreenshot: 01-feed
- tapOn:
    id: "item-card"
    index: 0
- assertVisible: "Sign in to contact"
- takeScreenshot: 02-item-details
- tapOn: "‹ Back"
- tapOn: "Map, tab.*"
- assertVisible: "Show my location"  # the locate button
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03-map

# Sign in as the demo account
- tapOn: "Settings, tab.*"
- tapOn: "you@example.com"
- inputText: ${EMAIL}
- hideKeyboard
- tapOn: "At least 6 characters"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    text: "Sign In"
    index: 1
# iOS pop-ups that may show up after signing in. They hide the app from
# Maestro, so handle them before waiting for Settings.
# "Save Password?" belongs to the iOS password manager, whose buttons Maestro
# can't read - tap "Not Now" by position (NOT_NOW above). The pop-up can take a
# few seconds to appear, so tap a few times; without it, that spot is empty
# space below the Settings card, so extra taps do nothing.
- repeat:
    times: 3
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          point: ${NOT_NOW}
# Notification permission ("optional" moves on if it doesn't appear).
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible: "Message notifications"
    timeout: 15000
- takeScreenshot: 07-settings

# Post tab: a sensitive category shows the "Hand it in?" link
- tapOn: "Post, tab.*"
- tapOn:
    text: "Wallet"
    index: 0
- assertVisible: "Consider handing it in.*"  # the link's accessibility label
- takeScreenshot: 04-post

# My posts, from the Feed header. The demo account needs at least one post.
- tapOn: "Feed, tab.*"
- tapOn: "My posts"
- extendedWaitUntil:
    visible:
      id: "item-card"
    timeout: 15000
- takeScreenshot: 08-my-posts
- tapOn: "‹ Back"

# Messages list, then the first chat in it. The flow only reads data: the demo
# account needs at least one conversation with messages.
- tapOn: "Messages, tab.*"
- extendedWaitUntil:
    visible:
      id: "conversation-row"
    timeout: 15000
- takeScreenshot: 06-messages
- tapOn:
    id: "conversation-row"
    index: 0
- extendedWaitUntil:
    visible: "Stay safe"
    timeout: 10000
- takeScreenshot: 05-chat
