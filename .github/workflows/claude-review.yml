# Claude reviewer: comment "@claude review" on a pull request and Claude reviews it
# against the PR's acceptance criteria (see REVIEW.md), then replies in the PR.
# Runs only when mentioned, so it uses your Claude Pro quota on demand.
# Needs the repo secret CLAUDE_CODE_OAUTH_TOKEN (create it with `claude setup-token`).
name: Claude review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
